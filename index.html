<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ayat Tunggal: SIAPA, BUAT APA, APA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3FB; --card:#FFFFFF; --ink:#14213D; --muted:#5B6784; --line:#D5DDED;
  --siapa:#2F6FED; --siapa-bg:#DCE8FF;
  --buat:#E08A00; --buat-bg:#FFEBC7;
  --apa:#0E9F6E;  --apa-bg:#D5F5E8;
  --bad:#D93F4C; --bad-bg:#FDE1E3;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  background:var(--bg); color:var(--ink); min-height:100vh;
  display:flex; justify-content:center; padding:20px 16px 40px;
}
main{width:100%; max-width:640px}
header{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px}
h1{font-size:1.25rem; font-weight:800; margin:0}
.stats{display:flex; gap:8px; font-weight:700; font-size:.95rem}
.stat{background:var(--card); border:2px solid var(--line); border-radius:999px; padding:2px 12px}
.bar{height:10px; background:var(--line); border-radius:999px; overflow:hidden; margin-bottom:18px}
.bar span{display:block; height:100%; width:0; background:var(--siapa); border-radius:999px; transition:width .3s}
.card{background:var(--card); border:2px solid var(--line); border-radius:22px; padding:22px 20px}
.sentence{
  font-size:clamp(1.9rem,7vw,2.8rem); font-weight:800; line-height:1.25;
  display:flex; flex-wrap:wrap; gap:6px 10px; margin:0 0 6px;
}
.part{padding:0 10px; border-radius:12px; border:3px solid transparent; transition:background .25s,border-color .25s}
.part small{display:block; font-size:.7rem; font-weight:700; line-height:1; padding-bottom:4px; height:0; opacity:0; overflow:hidden; transition:opacity .25s,height .25s}
.revealed .part small{height:auto; opacity:1}
.part.siapa.on{background:var(--siapa-bg); border-color:var(--siapa); color:var(--siapa)}
.part.buat.on{background:var(--buat-bg); border-color:var(--buat); color:#8A5400}
.part.apa.on{background:var(--apa-bg); border-color:var(--apa); color:#07694A}
.ask{font-size:1.15rem; color:var(--muted); margin:10px 0 16px; font-weight:500}
.ask b{font-weight:800; padding:1px 10px; border-radius:8px}
.ask b.siapa{background:var(--siapa-bg); color:var(--siapa)}
.ask b.buat{background:var(--buat-bg); color:#8A5400}
.ask b.apa{background:var(--apa-bg); color:#07694A}
.options{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.opt{
  font:inherit; font-size:1.3rem; font-weight:700; color:var(--ink);
  background:#fff; border:3px solid var(--line); border-radius:16px;
  padding:14px 10px; cursor:pointer; min-height:64px; text-align:center;
  transition:transform .08s, border-color .15s, background .15s;
}
.opt:hover:not(:disabled){border-color:var(--siapa)}
.opt:active:not(:disabled){transform:scale(.97)}
.opt:disabled{cursor:default}
.opt.right{background:var(--apa-bg); border-color:var(--apa); color:#07694A}
.opt.wrong{background:var(--bad-bg); border-color:var(--bad); color:var(--bad)}
.opt.dim{opacity:.55}
:focus-visible{outline:4px solid #14213D; outline-offset:3px}
.feedback{min-height:1.8em; margin:14px 0 0; font-size:1.2rem; font-weight:700}
.feedback.good{color:var(--apa)} .feedback.bad{color:var(--bad)}
.next{
  font:inherit; font-weight:800; font-size:1.2rem; color:#fff; background:var(--ink);
  border:0; border-radius:16px; padding:12px 26px; cursor:pointer; margin-top:10px; display:none;
}
.next.show{display:inline-block}
.end{text-align:center}
.end .big{font-size:3.4rem; font-weight:800; margin:0}
.end p{margin:4px 0 14px; font-size:1.15rem}
.hint{color:var(--muted); font-size:.85rem; text-align:center; margin-top:14px}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.opt.wrong{animation:shake .25s}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
@media (max-width:420px){.options{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <header>
    <h1>Ayat Tunggal</h1>
    <div class="stats" aria-live="polite">
      <span class="stat" id="score">Markah 0</span>
      <span class="stat" id="streak">Berturut 0</span>
    </div>
  </header>
  <div class="bar" role="progressbar" aria-label="Kemajuan" id="barWrap"><span id="bar"></span></div>
  <section class="card" id="card"></section>
  <p class="hint">Tekan kekunci 1 hingga 4 untuk memilih jawapan, Enter untuk soalan seterusnya.</p>
</main>

<script>
/* ===== UBAH SOALAN DI SINI =====
   Setiap ayat ada tiga bahagian: [SIAPA, BUAT APA, APA]. */
const SENTENCES = [
  ["Ali", "membaca", "buku"],
  ["Siti", "menyiram", "bunga"],
  ["Amir", "menendang", "bola"],
  ["Aina", "membasuh", "pinggan"],
  ["Kumar", "menunggang", "basikal"],
  ["Mei Ling", "melukis", "gambar"],
  ["Hafiz", "memakan", "epal"],
];
/* ================================ */

const CATS = [
  {key:"siapa", label:"SIAPA"},
  {key:"buat",  label:"BUAT APA"},
  {key:"apa",   label:"APA"},
];
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; };

function buildQuestions(){
  const qs = [];
  SENTENCES.forEach((s,i) => {
    for (let c=0;c<3;c++){
      const others = [0,1,2].filter(k=>k!==c).map(k=>s[k]);
      const extra = SENTENCES[(i+1)%SENTENCES.length][(c+1)%3];
      qs.push({sIdx:i, cat:c, correct:s[c], options:shuffle([s[c],...others,extra])});
    }
  });
  return shuffle(qs);
}

let Q, n, score, streak, locked;
const $ = id => document.getElementById(id);
const card = $("card");

function start(){ Q = buildQuestions(); n = 0; score = 0; streak = 0; show(); }

function updateStats(){
  $("score").textContent = "Markah " + score;
  $("streak").textContent = "Berturut " + streak;
  $("bar").style.width = (n / Q.length * 100) + "%";
  $("barWrap").setAttribute("aria-valuenow", Math.round(n / Q.length * 100));
}

function show(){
  updateStats();
  if (n >= Q.length) return finish();
  locked = false;
  const q = Q[n], s = SENTENCES[q.sIdx], cat = CATS[q.cat];
  card.innerHTML = `
    <p class="sentence" id="sentence">${s.map((w,i)=>`<span class="part ${CATS[i].key}" data-i="${i}"><small>${CATS[i].label}</small>${w}</span>`).join("")}</p>
    <p class="ask">Pilih perkataan yang mewakili <b class="${cat.key}">${cat.label}</b></p>
    <div class="options" id="options">
      ${q.options.map((o,i)=>`<button class="opt" data-v="${o}"><span aria-hidden="true">${i+1}. </span>${o}</button>`).join("")}
    </div>
    <p class="feedback" id="fb" aria-live="assertive"></p>
    <button class="next" id="next">${n === Q.length-1 ? "Lihat markah" : "Soalan seterusnya"}</button>`;
  card.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => answer(b)));
  $("next").addEventListener("click", () => { n++; show(); });
}

function answer(btn){
  if (locked) return;
  locked = true;
  const q = Q[n], ok = btn.dataset.v === q.correct;
  card.querySelectorAll(".opt").forEach(b => {
    b.disabled = true;
    if (b.dataset.v === q.correct) b.classList.add("right");
    else if (b === btn) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  if (ok){ score += 10 + Math.min(streak,5)*2; streak++; }
  else { streak = 0; }
  // Tunjukkan warna bagi ketiga-tiga bahagian ayat
  $("sentence").classList.add("revealed");
  $("sentence").querySelectorAll(".part").forEach(p => p.classList.add("on"));
  const fb = $("fb");
  const s = SENTENCES[q.sIdx];
  fb.className = "feedback " + (ok ? "good" : "bad");
  fb.textContent = ok ? "Betul!" : `Belum tepat. ${CATS[q.cat].label} ialah "${q.correct}".`;
  const nx = $("next"); nx.classList.add("show"); nx.focus();
  $("score").textContent = "Markah " + score;
  $("streak").textContent = "Berturut " + streak;
}

function finish(){
  const max = Q.length * 10;
  card.innerHTML = `
    <div class="end">
      <p class="big">${score}</p>
      <p>markah daripada ${Q.length} soalan</p>
      <button class="next show" id="again">Main lagi</button>
    </div>`;
  $("again").addEventListener("click", start);
  $("again").focus();
}

document.addEventListener("keydown", e => {
  if (e.key >= "1" && e.key <= "4" && !locked && n < Q.length){
    const b = card.querySelectorAll(".opt")[Number(e.key)-1]; if (b) answer(b);
  }
});

start();
</script>
</body>
</html>
